// SYSTEM FUNCTIONS
function updateStatusUI() {
    const dot = document.getElementById('statusDot');
    if (dot) {
        if (navigator.onLine) dot.classList.add('online');
        else dot.classList.remove('online');
    }
}

function loadEmailJS() {
    if (navigator.onLine && !window.emailjs) {
        const script = document.createElement('script');
        script.src = "https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js";
        script.onload = function() { emailjs.init("-Ofjxy1x11TDIa2H0"); updateStatusUI(); };
        document.head.appendChild(script);
    }
}

function enterApp() {
    document.getElementById('loginLay').style.display = 'none';
    document.getElementById('mainLay').style.display = 'flex';
    generateMap(); 
    loadEmailJS();
    initHammer();
    setTimeout(resetZoom, 200);
}

//MAP IMAGES
function generateMap() {
    const map = document.getElementById('map');
    if(!map) return;
    map.innerHTML = '';

    // 1. Bridges (drawn first, sit behind buildings)
    bridges.forEach(br => {
        const el = document.createElement('div');
        el.className = 'bridge';
        el.style.left = (br.x * 100) + "%";
        el.style.top = (br.y * 100) + "%";
        el.style.width = (br.w * 100) + "%";
        el.style.height = (br.h * 100) + "%";
        map.appendChild(el);
    });

    // 2. Decorative tags (wash areas, e-bike parking)
    decorItems.forEach(d => {
        const el = document.createElement('div');
        el.className = 'decorTag';
        el.innerHTML = d.label;
        el.style.left = (d.x * 100) + "%";
        el.style.top = (d.y * 100) + "%";
        el.style.width = (d.w * 100) + "%";
        el.style.height = (d.h * 100) + "%";
        map.appendChild(el);
    });

    // 3. Jose Rizal flag marker
    const flag = document.createElement('div');
    flag.className = 'flagBox';
    flag.style.left = "19.2%"; flag.style.top = "68.5%";

function initHammer() {
    const mapArea = document.getElementById('mapArea');
    if (!mapArea) return;
    
    mapArea.addEventListener('wheel', (e) => {
        e.preventDefault();
        const delta = e.deltaY > 0 ? 0.9 : 1.1;
        const newScale = currentScale * delta;
        if (newScale > 0.1 && newScale < 4) {
            currentScale = newScale;
            updateTransform();
        }
    }, { passive: false });

    if (typeof Hammer === 'undefined') return;

    const mc = new Hammer.Manager(mapArea);
    mc.add(new Hammer.Pan({ threshold: 0, pointers: 0 }));
    mc.add(new Hammer.Pinch({ threshold: 0 })).recognizeWith(mc.get('pan'));

    mc.on("panstart pinchstart", (e) => { 
        lastPosX = posX; 
        lastPosY = posY; 
        lastScale = currentScale; 
    });

    mc.on("panmove", (e) => { 
        posX = lastPosX + e.deltaX; 
        posY = lastPosY + e.deltaY; 
        updateTransform(); 
    });

    mc.on("pinchmove", (e) => {
        currentScale = Math.min(Math.max(lastScale * e.scale, 0.1), 4);
        posX = lastPosX + e.deltaX;
        posY = lastPosY + e.deltaY;
        updateTransform();
    });
}

function updateTransform() {
    const mapEl = document.getElementById('map');
    if(mapEl) mapEl.style.transform = `translate3d(${posX}px, ${posY}px, 0) scale(${currentScale})`;
}

function resetZoom() {
    const area = document.getElementById('mapArea');
    if(!area) return;
    const isMobile = window.innerWidth < 600; 
    const scaleX = area.clientWidth / 1500;
    const scaleY = area.clientHeight / 1000;
    
    if (isMobile) {
        currentScale = Math.max(scaleX, scaleY) * 2.5; 
        posX = 150; 
        posY = -50; 
    } else {
        currentScale = Math.min(scaleX, scaleY) * 0.95;
        posX = -150; 
        posY = 15;
    }
    updateTransform();
}

function openBuilding(label, id, max, target) {
    let h = ``;
    if(id === "court") {
        h += `<button class="floorBtn" onclick="showTeachers('ict','1st Floor')">Near Bathroom (ICT)</button>`;
        h += `<button class="floorBtn" onclick="showTeachers('grade7','1st Floor')">Near CR (G7)</button>`;
    } else if (max > 0) {
        for (let i=1; i<=max; i++) {
            let n = i + (i===1?'st':i===2?'nd':i===3?'rd':'th') + " Floor";
            h += `<button class="floorBtn" onclick="showTeachers('${id}','${n}')">${n}</button>`;
        }
    }
    if(id === "eim") h += `<hr style="opacity:0.2; margin:10px 0;"><button class="floorBtn" style="background:var(--danger); color:white;" onclick="showClinicInfo()">SCHOOL CLINIC</button>`;
    if(target) h += `<hr style="opacity:0.2; margin:10px 0;"><button class="floorBtn" style="background:var(--success); color:white;" onclick="window.location.href='pano.html?target=${target}&session=active'"><i class="ri-panorama-line"></i> VIEW 360° PANO</button>`;
    showModal(label, h || "Ground Floor Only");
}

function onSearch() {
    const q = document.getElementById('searchInput').value.toLowerCase().trim();
    if (!q) return;
    const b = buildings.find(x => x.label.toLowerCase().includes(q));
    if (b) { highlightOnMap(b.id); openBuilding(b.label, b.id, b.maxFloor || 0, b.panoTarget); return; }
    const t = allTeachers.filter(x => x.name.toLowerCase().includes(q));
    if (t.length > 0) {
        showModal("Results", t.map(x => `<div class="teacher-card" onclick="highlightOnMap('${x.building}')"><b>${x.name}</b><br><small>${x.details} - ${x.floor}</small></div>`).join(""));
    } else alert("Not found.");
}

function highlightOnMap(bId) {
    clearHighlights();
    const btn = document.getElementById("map-bldg-" + bId);
    if(btn) {
        btn.classList.add('highlight-building');

        currentScale = 1.0; // zoom level when focusing a building

        const mapCenterX = 750;  // half of #map's 1500px width
        const mapCenterY = 500;  // half of #map's 1000px height
        const btnCenterX = btn.offsetLeft + btn.offsetWidth / 2;
        const btnCenterY = btn.offsetTop + btn.offsetHeight / 2;

        posX = -(btnCenterX - mapCenterX) * currentScale;
        posY = -(btnCenterY - mapCenterY) * currentScale;

        updateTransform();
        setTimeout(closeModal, 500);
    }
}

function clearHighlights() { document.querySelectorAll('.mapBtn').forEach(b => b.classList.remove('highlight-building')); }

function showReportForm() {
    if(!navigator.onLine) {
        alert("Note: No internet. Report will be saved locally on this device.");
    }
    let html = `<label>Area</label><select id="reportLoc">${buildings.map(b => `<option>${b.label}</option>`).join('')}</select>
        <textarea id="reportDesc" rows="3" placeholder="Description..."></textarea>
        <input type="file" id="reportImgInput" onchange="previewImage(event)"><img id="photoPreview" style="width:100%; border-radius:10px; display:none; margin-top:10px;">
        <button id="submitBtn" class="floorBtn" style="background:var(--accent); color:black;" onclick="submitReport('Maintenance')">SUBMIT</button>`;
    showModal("Report", html);
}

function previewImage(e) {
    const r = new FileReader();
    r.onload = () => { const p = document.getElementById('photoPreview'); p.src = r.result; p.style.display = 'block'; };
    if(e.target.files[0]) r.readAsDataURL(e.target.files[0]);
}

function submitReport(type) {
    const desc = document.getElementById('reportDesc').value;
    const loc = document.getElementById('reportLoc').value;
    const btn = document.getElementById('submitBtn');
    const time = new Date().toLocaleString();
    if(!desc) return alert("Add details.");
    
    if(!navigator.onLine || !window.emailjs) { 
        saveAndClose(type, loc, desc, time); 
        return; 
    }
    
    btn.disabled = true; btn.innerHTML = "SENDING...";
    emailjs.send("limnavi1", "template_dftp7y9", { type, location: loc, description: desc, time })
        .then(() => { alert("Sent!"); saveAndClose(type, loc, desc, time); })
        .catch(() => { saveAndClose(type, loc, desc, time); });
}

function saveAndClose(type, loc, desc, time) {
    const p = document.getElementById('photoPreview');
    maintenanceReports.push({ id: Date.now(), type, loc, desc, img: (p && p.style.display!=='none')?p.src:"", time });
    localStorage.setItem('limnavi_reports', JSON.stringify(maintenanceReports));
    closeModal();
    alert("Saved to Maintenance Logs.");
}

function viewReports() {
    toggleDrawer(); 
    document.getElementById('reportOverlay').style.display = 'flex';
    const grid = document.getElementById('reportGrid');
    if (maintenanceReports.length === 0) {
        grid.innerHTML = "<p style='padding:20px; color:var(--text-dim);'>No logs found.</p>";
        return;
    }
    grid.innerHTML = maintenanceReports.map(r => `
        <div class="report-wide-card" style="background:#1e293b; padding:15px; border-radius:15px; border-top: 4px solid var(--accent); margin-bottom:10px;">
            <small>${r.type} - ${r.time}</small><br><b>${r.loc}</b><p>${r.desc}</p>
            ${r.img ? `<img src="${r.img}" style="width:100%; border-radius:10px; margin:10px 0;">` : ''}
            <button onclick="resolveReport(${r.id})" style="background:#10b981; color:white; width:100%; padding:10px; border-radius:10px; margin-top:10px;">Resolve</button>
        </div>`).join("");
}

function resolveReport(id) {
    maintenanceReports = maintenanceReports.filter(r => r.id !== id);
    localStorage.setItem('limnavi_reports', JSON.stringify(maintenanceReports));
    viewReports(); 
}

function showModal(t, b) { 
    document.getElementById('modalTitle').innerText = t; 
    document.getElementById('modalBody').innerHTML = b; 
    document.getElementById('modal').style.display = 'flex'; 
}

function closeModal() { document.getElementById('modal').style.display = 'none'; }
function toggleDrawer() { document.getElementById('drawer').classList.toggle('open'); }
function closeReports() { document.getElementById('reportOverlay').style.display = 'none'; }

function showTeachers(id, n) {
    const list = allTeachers.filter(t => t.building === id && t.floor === n);
    showModal(n, list.length ? list.map(t => `<div class="teacher-card"><b>${t.name}</b><br><small>${t.details}</small></div>`).join("") : "No data.");
}
